rules:
  # ── Java: MessageDigest MD5 ───────────────────────────────────────────────────
  - id: java-weak-hash-md5
    patterns:
      - pattern: MessageDigest.getInstance("MD5")
    message: >
      MessageDigest.getInstance("MD5") detected. MD5 is cryptographically broken
      and susceptible to collision attacks. Migrate to SHA-256 or SHA-3.
    languages: [java]
    severity: ERROR
    metadata:
      algorithm: MD5
      category: weak-hash
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 3
      mosca_y: 5
      mosca_z: 5

  # ── Java: MessageDigest SHA-1 ─────────────────────────────────────────────────
  - id: java-weak-hash-sha1
    patterns:
      - pattern: MessageDigest.getInstance("SHA-1")
    message: >
      MessageDigest.getInstance("SHA-1") detected. SHA-1 is cryptographically weak.
      Migrate to SHA-256 or SHA-3.
    languages: [java]
    severity: ERROR
    metadata:
      algorithm: SHA1
      category: weak-hash
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 1
      mosca_y: 1
      mosca_z: 10

  - id: java-weak-hash-sha1-alt
    patterns:
      - pattern: MessageDigest.getInstance("SHA1")
    message: >
      MessageDigest.getInstance("SHA1") detected. SHA-1 is cryptographically weak.
      Migrate to SHA-256 or SHA-3.
    languages: [java]
    severity: ERROR
    metadata:
      algorithm: SHA1
      category: weak-hash
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 1
      mosca_y: 1
      mosca_z: 10

  # ── Java: DES Cipher ─────────────────────────────────────────────────────────
  - id: java-insecure-des
    patterns:
      - pattern: Cipher.getInstance("DES/...")
    message: >
      DES cipher detected (javax.crypto). DES uses a 56-bit key and has been
      broken since 1997. Replace with AES-256-GCM.
    languages: [java]
    severity: ERROR
    metadata:
      algorithm: DES
      category: broken-cipher
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 5
      mosca_y: 6
      mosca_z: 5

  - id: java-insecure-des-plain
    patterns:
      - pattern: Cipher.getInstance("DES")
    message: >
      DES cipher detected (javax.crypto). DES uses a 56-bit key and has been
      broken since 1997. Replace with AES-256-GCM.
    languages: [java]
    severity: ERROR
    metadata:
      algorithm: DES
      category: broken-cipher
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 5
      mosca_y: 6
      mosca_z: 5

  # ── Java: 3DES Cipher ─────────────────────────────────────────────────────────
  - id: java-insecure-3des
    patterns:
      - pattern: Cipher.getInstance("DESede/...")
    message: >
      3DES (DESede) cipher detected. 3DES is slow and vulnerable to Sweet32 birthday
      attacks. Migrate to AES-256-GCM.
    languages: [java]
    severity: WARNING
    metadata:
      algorithm: 3DES
      category: weak-cipher
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 3
      mosca_y: 3
      mosca_z: 10

  # ── Java: RC4 (ARCFOUR) Cipher ───────────────────────────────────────────────
  - id: java-insecure-rc4
    patterns:
      - pattern: Cipher.getInstance("ARCFOUR")
    message: >
      RC4 (ARCFOUR) stream cipher detected. RC4 is cryptographically broken.
      Migrate to AES-256-GCM or ChaCha20-Poly1305.
    languages: [java]
    severity: ERROR
    metadata:
      algorithm: RC4
      category: broken-cipher
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 2
      mosca_y: 2
      mosca_z: 10

  # ── Java: RSA KeyPairGenerator (quantum-vulnerable) ──────────────────────────
  - id: java-rsa-quantum-vulnerable
    patterns:
      - pattern: KeyPairGenerator.getInstance("RSA")
    message: >
      RSA KeyPairGenerator detected. RSA is quantum-vulnerable (Shor's algorithm).
      Migrate to ML-KEM (NIST FIPS 203).
    languages: [java]
    severity: WARNING
    metadata:
      algorithm: RSA
      category: quantum-vulnerable
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 15
      mosca_y: 5
      mosca_z: 7

  # ── Java: EC KeyPairGenerator (quantum-vulnerable) ───────────────────────────
  - id: java-ecdsa-quantum-vulnerable
    patterns:
      - pattern: KeyPairGenerator.getInstance("EC")
    message: >
      EC (Elliptic Curve) KeyPairGenerator detected. ECDSA/ECDH are quantum-vulnerable
      (Shor's algorithm). Migrate to ML-DSA (NIST FIPS 204) or ML-KEM (NIST FIPS 203).
    languages: [java]
    severity: WARNING
    metadata:
      algorithm: ECDSA
      category: quantum-vulnerable
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 5
      mosca_y: 5
      mosca_z: 7

  # ── Java: DSA KeyPairGenerator (quantum-vulnerable) ──────────────────────────
  - id: java-dsa-quantum-vulnerable
    patterns:
      - pattern: KeyPairGenerator.getInstance("DSA")
    message: >
      DSA KeyPairGenerator detected. DSA is quantum-vulnerable (Shor's algorithm).
      Migrate to ML-DSA (NIST FIPS 204).
    languages: [java]
    severity: WARNING
    metadata:
      algorithm: DSA
      category: quantum-vulnerable
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 5
      mosca_y: 5
      mosca_z: 7

  # ── Java: Diffie-Hellman (quantum-vulnerable) ─────────────────────────────────
  - id: java-dh-quantum-vulnerable
    patterns:
      - pattern: KeyPairGenerator.getInstance("DH")
    message: >
      Diffie-Hellman (DH) KeyPairGenerator detected. DH key exchange is
      quantum-vulnerable. Migrate to ML-KEM (NIST FIPS 203).
    languages: [java]
    severity: WARNING
    metadata:
      algorithm: DH
      category: quantum-vulnerable
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 7
      mosca_y: 3
      mosca_z: 7

  # ── Java: SecureRandom with weak algorithm ────────────────────────────────────
  - id: java-weak-prng
    patterns:
      - pattern: SecureRandom.getInstance("SHA1PRNG")
    message: >
      SHA1PRNG SecureRandom algorithm detected. SHA1PRNG is not recommended.
      Use the default SecureRandom() constructor or "NativePRNG" instead.
    languages: [java]
    severity: WARNING
    metadata:
      algorithm: SHA1
      category: weak-prng
      cwe: CWE-330
      owasp: A02:2021
      mosca_x: 1
      mosca_y: 1
      mosca_z: 10
