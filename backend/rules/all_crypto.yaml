rules:
  # ── Python ──────────────────────────────────────────────────────────────────
  - id: weak-hash-md5
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.new("md5", ...)
      - pattern: hashlib.new("MD5", ...)
    message: >
      Use of MD5 detected. MD5 is cryptographically broken and susceptible to
      collision attacks (SHAttered, chosen-prefix collisions). Migrate to
      SHA-256 or SHA-3.
    languages: [python]
    severity: ERROR
    metadata:
      algorithm: MD5
      category: weak-hash
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 3
      mosca_y: 5
      mosca_z: 5

  - id: weak-rsa-key-size
    patterns:
      - pattern: RSA.generate($SIZE)
      - metavariable-comparison:
          metavariable: $SIZE
          comparison: $SIZE < 2048
    message: >
      RSA key size $SIZE is below the NIST minimum of 2048 bits. Keys under
      2048 bits are vulnerable to factoring attacks. Use RSA-4096 or migrate
      to ML-KEM (FIPS 203).
    languages: [python]
    severity: ERROR
    metadata:
      algorithm: RSA
      category: weak-key-size
      cwe: CWE-326
      owasp: A02:2021
      mosca_x: 5
      mosca_y: 7
      mosca_z: 5

  - id: insecure-des-cipher
    patterns:
      - pattern: DES.new(...)
    message: >
      Use of DES detected. DES uses a 56-bit key and has been broken since
      1997. Replace with AES-256-GCM or ChaCha20-Poly1305.
    languages: [python]
    severity: ERROR
    metadata:
      algorithm: DES
      category: broken-cipher
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 5
      mosca_y: 6
      mosca_z: 5

  - id: ecdsa-usage
    patterns:
      - pattern: ecdsa.SigningKey.generate(...)
    message: >
      ECDSA is vulnerable to quantum attacks (Shor's algorithm). Migrate to ML-DSA (FIPS 204).
    languages: [python]
    severity: WARNING
    metadata:
      algorithm: ECDSA
      category: quantum-vulnerable
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 5
      mosca_y: 5
      mosca_z: 7

  - id: dh-usage
    patterns:
      - pattern: cryptography.hazmat.primitives.asymmetric.dh.generate_parameters(...)
    message: >
      Diffie-Hellman key exchange is quantum-vulnerable. Migrate to ML-KEM (FIPS 203).
    languages: [python]
    severity: WARNING
    metadata:
      algorithm: DH
      category: quantum-vulnerable
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 7
      mosca_y: 3
      mosca_z: 7

  - id: ed25519-usage
    patterns:
      - pattern: ed25519.Ed25519PrivateKey.generate()
    message: >
      Ed25519 is quantum-vulnerable. Migrate to ML-DSA (FIPS 204).
    languages: [python]
    severity: WARNING
    metadata:
      algorithm: ED25519
      category: quantum-vulnerable
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 10
      mosca_y: 3
      mosca_z: 7

  - id: rsa-quantum-vulnerable
    patterns:
      - pattern: RSA.generate($SIZE)
      - metavariable-comparison:
          metavariable: $SIZE
          comparison: $SIZE >= 2048
    message: >
      RSA >= 2048 is classically secure but quantum-vulnerable. Migrate to ML-KEM (FIPS 203).
    languages: [python]
    severity: WARNING
    metadata:
      algorithm: RSA
      category: quantum-vulnerable
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 15
      mosca_y: 5
      mosca_z: 7

  - id: weak-hash-sha1
    pattern-either:
      - pattern: hashlib.sha1(...)
      - pattern: hashlib.new("sha1", ...)
      - pattern: hashlib.new("SHA1", ...)
    message: >
      SHA-1 is cryptographically weak. It is susceptible to collision attacks
      (SHAttered, ca. 2^63). Migrate to SHA-256 or SHA-3.
    languages: [python]
    severity: ERROR
    metadata:
      algorithm: SHA1
      category: weak-hash
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 1
      mosca_y: 1
      mosca_z: 10

  - id: insecure-rc4
    patterns:
      - pattern: ARC4.new(...)
    message: >
      RC4 is a broken stream cipher. Migrate to AES-256-GCM.
    languages: [python]
    severity: ERROR
    metadata:
      algorithm: RC4
      category: broken-cipher
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 2
      mosca_y: 2
      mosca_z: 10

  - id: insecure-3des
    patterns:
      - pattern: DES3.new(...)
    message: >
      3DES is slow and vulnerable to Sweet32. Migrate to AES-256-GCM.
    languages: [python]
    severity: WARNING
    metadata:
      algorithm: 3DES
      category: weak-cipher
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 3
      mosca_y: 3
      mosca_z: 10

  - id: insecure-blowfish
    patterns:
      - pattern: Blowfish.new(...)
    message: >
      Blowfish has a 64-bit block size and is vulnerable to birthday attacks. Migrate to AES.
    languages: [python]
    severity: WARNING
    metadata:
      algorithm: BLOWFISH
      category: weak-cipher
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 2
      mosca_y: 2
      mosca_z: 10

  - id: python-ecb-mode
    pattern-either:
      - pattern: AES.new(..., AES.MODE_ECB)
      - pattern: AES.new(..., mode=AES.MODE_ECB)
    message: >
      AES ECB mode detected. Identical plaintext blocks produce identical
      ciphertext, leaking data patterns. Use AES-GCM or ChaCha20-Poly1305.
    languages: [python]
    severity: ERROR
    metadata:
      algorithm: AES-ECB
      category: broken-cipher
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 5
      mosca_y: 3
      mosca_z: 5

  - id: python-weak-dsa
    patterns:
      - pattern: DSA.generate(...)
    message: >
      DSA is quantum-vulnerable under Shor's algorithm. Migrate to ML-DSA (FIPS 204).
    languages: [python]
    severity: WARNING
    metadata:
      algorithm: DSA
      category: quantum-vulnerable
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 7
      mosca_y: 3
      mosca_z: 7

  - id: secure-aes-gcm
    patterns:
      - pattern: AES.new(..., AES.MODE_GCM)
    message: >
      AES-GCM is a secure, authenticated symmetric cipher and is quantum-resistant with 256-bit keys.
    languages: [python]
    severity: INFO
    metadata:
      algorithm: AES-GCM
      category: secure-cipher
      cwe: N/A
      owasp: N/A
      mosca_x: 20
      mosca_y: 1
      mosca_z: 50

  - id: secure-sha256
    patterns:
      - pattern: hashlib.sha256(...)
    message: >
      SHA-256 is a secure cryptographic hash function.
    languages: [python]
    severity: INFO
    metadata:
      algorithm: SHA256
      category: secure-hash
      cwe: N/A
      owasp: N/A
      mosca_x: 10
      mosca_y: 1
      mosca_z: 50

  - id: pqc-kyber
    patterns:
      - pattern: pqcrypto.kem.kyber512.generate_keypair()
    message: >
      Kyber (ML-KEM) is a NIST FIPS 203 post-quantum standard.
    languages: [python]
    severity: INFO
    metadata:
      algorithm: ML-KEM
      category: pqc-kem
      cwe: N/A
      owasp: N/A
      mosca_x: 30
      mosca_y: 0
      mosca_z: 50

  - id: pqc-dilithium
    patterns:
      - pattern: pqcrypto.sign.dilithium2.generate_keypair()
    message: >
      Dilithium (ML-DSA) is a NIST FIPS 204 post-quantum standard.
    languages: [python]
    severity: INFO
    metadata:
      algorithm: ML-DSA
      category: pqc-signature
      cwe: N/A
      owasp: N/A
      mosca_x: 30
      mosca_y: 0
      mosca_z: 50

  - id: py-crypto
    languages: [python]
    severity: WARNING
    message: "Python cryptography used."
    pattern-either:
      - pattern: hashlib.$FUNC(...)
      - pattern-regex: "import (hashlib|cryptography)"
    metadata:
      algorithm: LEGACY-PYTHON-CRYPTO
      category: weak-hash
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 5
      mosca_y: 5
      mosca_z: 5

  # ── JavaScript / TypeScript ───────────────────────────────────────────────────
  - id: js-weak-hash-md5
    pattern-either:
      - pattern: $X.createHash("md5")
      - pattern: $X.createHash('md5')
      - pattern: createHash("md5")
      - pattern: createHash('md5')
    message: >
      Use of MD5 detected (crypto.createHash). MD5 is broken and susceptible to
      collision attacks. Migrate to SHA-256.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      algorithm: MD5
      category: weak-hash
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 3
      mosca_y: 5
      mosca_z: 5

  - id: js-weak-hash-sha1
    pattern-either:
      - pattern: $X.createHash("sha1")
      - pattern: $X.createHash('sha1')
      - pattern: createHash("sha1")
      - pattern: createHash('sha1')
    message: >
      Use of SHA-1 detected (crypto.createHash). SHA-1 is susceptible to
      collision attacks. Migrate to SHA-256.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      algorithm: SHA1
      category: weak-hash
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 1
      mosca_y: 1
      mosca_z: 10

  - id: js-deprecated-create-cipher
    pattern-either:
      - pattern: $X.createCipher($ALGO, ...)
      - pattern: $X.createDecipher($ALGO, ...)
    message: >
      crypto.createCipher()/createDecipher() are deprecated: they derive the key
      and IV from a single passphrase. Use createCipheriv() with an explicit,
      cryptographically random IV.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      algorithm: OPENSSL-LEGACY
      category: deprecated-cipher
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 5
      mosca_y: 5
      mosca_z: 5

  - id: js-insecure-des
    pattern-either:
      - pattern: $X.createCipheriv("des-cbc", ...)
      - pattern: $X.createCipheriv('des-cbc', ...)
      - pattern: $X.createCipheriv("des-ecb", ...)
      - pattern: $X.createCipheriv('des-ecb', ...)
      - pattern: $X.createCipheriv("des-cfb", ...)
      - pattern: $X.createCipheriv('des-cfb', ...)
      - pattern: $X.createCipheriv("des-ofb", ...)
      - pattern: $X.createCipheriv('des-ofb', ...)
    message: >
      DES detected (crypto.createCipheriv). DES uses a 56-bit key and has been
      broken since 1997. Use AES-256-GCM.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      algorithm: DES
      category: broken-cipher
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 5
      mosca_y: 6
      mosca_z: 5

  - id: js-insecure-3des
    pattern-either:
      - pattern: $X.createCipheriv("des-ede3-cbc", ...)
      - pattern: $X.createCipheriv('des-ede3-cbc', ...)
      - pattern: $X.createCipheriv("des-ede3-ecb", ...)
      - pattern: $X.createCipheriv('des-ede3-ecb', ...)
    message: >
      3DES detected (crypto.createCipheriv). 3DES is slow and vulnerable to
      Sweet32. Use AES-256-GCM.
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      algorithm: 3DES
      category: weak-cipher
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 3
      mosca_y: 3
      mosca_z: 10

  - id: js-insecure-rc4
    pattern-either:
      - pattern: $X.createCipheriv("rc4", ...)
      - pattern: $X.createCipheriv('rc4', ...)
      - pattern: $X.createCipheriv("rc4-drop", ...)
      - pattern: $X.createCipheriv('rc4-drop', ...)
    message: >
      RC4 detected (crypto.createCipheriv). RC4 is a broken stream cipher.
      Use AES-256-GCM.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      algorithm: RC4
      category: broken-cipher
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 2
      mosca_y: 2
      mosca_z: 10

  - id: js-ecb-mode
    patterns:
      - pattern: $X.createCipheriv($ALGORITHM, ...)
      - metavariable-regex:
          metavariable: $ALGORITHM
          regex: '(?i).*ecb.*'
    message: >
      ECB mode detected in crypto.createCipheriv. Identical plaintext blocks
      produce identical ciphertext, leaking data patterns. Use AES-GCM.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      algorithm: AES-ECB
      category: broken-cipher
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 5
      mosca_y: 3
      mosca_z: 5

  - id: js-quantum-vulnerable-ec
    pattern-either:
      - pattern: $X.generateKeyPairSync("ec", ...)
      - pattern: $X.generateKeyPairSync('ec', ...)
      - pattern: $X.generateKeyPair("ec", ...)
      - pattern: $X.generateKeyPair('ec', ...)
      - pattern: $X.createECDH(...)
    message: >
      Elliptic-curve cryptography (ECDSA/ECDH) is quantum-vulnerable under
      Shor's algorithm. Migrate to ML-KEM and ML-DSA.
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      algorithm: ECDSA-ECDH
      category: quantum-vulnerable
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 5
      mosca_y: 5
      mosca_z: 7

  - id: js-cryptojs-md5
    pattern-either:
      - pattern: CryptoJS.MD5(...)
    message: >
      CryptoJS.MD5 detected. MD5 is cryptographically broken. Migrate to
      SHA-256 or SHA-3.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      algorithm: MD5
      category: weak-hash
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 3
      mosca_y: 5
      mosca_z: 5

  - id: js-cryptojs-sha1
    pattern-either:
      - pattern: CryptoJS.SHA1(...)
    message: >
      CryptoJS.SHA1 detected. SHA-1 is susceptible to collision attacks.
      Migrate to SHA-256.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      algorithm: SHA1
      category: weak-hash
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 1
      mosca_y: 1
      mosca_z: 10

  - id: js-cryptojs-des
    pattern-either:
      - pattern: CryptoJS.DES.encrypt(...)
      - pattern: CryptoJS.DES.decrypt(...)
      - pattern: CryptoJS.TripleDES.encrypt(...)
      - pattern: CryptoJS.TripleDES.decrypt(...)
    message: >
      CryptoJS DES/3DES detected. DES is broken and 3DES is weak (Sweet32).
      Use a modern AEAD cipher such as AES-GCM.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      algorithm: DES
      category: broken-cipher
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 5
      mosca_y: 6
      mosca_z: 5

  - id: js-cryptojs-rc4
    pattern-either:
      - pattern: CryptoJS.RC4.encrypt(...)
      - pattern: CryptoJS.RC4.decrypt(...)
      - pattern: CryptoJS.RC4Drop.encrypt(...)
      - pattern: CryptoJS.RC4Drop.decrypt(...)
    message: >
      CryptoJS RC4 detected. RC4 is a broken stream cipher. Use AES-256-GCM.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      algorithm: RC4
      category: broken-cipher
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 2
      mosca_y: 2
      mosca_z: 10

  - id: js-crypto-js-ecb
    patterns:
      - pattern: 'CryptoJS.AES.encrypt(..., ..., { mode: CryptoJS.mode.ECB })'
    message: >
      CryptoJS AES ECB mode detected. ECB leaks data patterns; use
      CryptoJS.mode values backed by GCM/CTR with an IV.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      algorithm: AES-ECB
      category: broken-cipher
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 5
      mosca_y: 3
      mosca_z: 5

  - id: js-secure-aes-gcm
    pattern-either:
      - pattern: $X.createCipheriv("aes-256-gcm", ...)
      - pattern: $X.createCipheriv('aes-256-gcm', ...)
      - pattern: $X.createCipheriv("aes-128-gcm", ...)
      - pattern: $X.createCipheriv('aes-128-gcm', ...)
      - pattern: $X.createCipheriv("aes-192-gcm", ...)
      - pattern: $X.createCipheriv('aes-192-gcm', ...)
    message: >
      AES-GCM is a secure, authenticated symmetric cipher and is
      quantum-resistant with 256-bit keys.
    languages: [javascript, typescript]
    severity: INFO
    metadata:
      algorithm: AES-GCM
      category: secure-cipher
      cwe: N/A
      owasp: N/A
      mosca_x: 20
      mosca_y: 1
      mosca_z: 50

  - id: js-secure-sha256
    pattern-either:
      - pattern: $X.createHash("sha256")
      - pattern: $X.createHash('sha256')
      - pattern: $X.createHash("sha512")
      - pattern: $X.createHash('sha512')
      - pattern: createHash("sha256")
      - pattern: createHash('sha256')
      - pattern: createHash("sha512")
      - pattern: createHash('sha512')
    message: >
      SHA-256/SHA-512 is a secure cryptographic hash family.
    languages: [javascript, typescript]
    severity: INFO
    metadata:
      algorithm: SHA256
      category: secure-hash
      cwe: N/A
      owasp: N/A
      mosca_x: 10
      mosca_y: 1
      mosca_z: 50

  - id: js-crypto
    languages: [javascript, typescript]
    severity: WARNING
    message: "JS cryptography used."
    pattern-either:
      - pattern: $X.createHash(...)
      - pattern: $X.createCipher(...)
      - pattern: $X.createCipheriv(...)
      - pattern: $X.createDecipheriv(...)
      - pattern-regex: "require\\('(crypto|bcrypt|crypto-js)'\\)"
      - pattern-regex: "require\\(\"(crypto|bcrypt|crypto-js)\"\\)"
      - pattern-regex: "(from|import)[\\s'\"]*(node:)?(crypto|bcrypt|crypto-js)"
    metadata:
      algorithm: LEGACY-JS-CRYPTO
      category: broken-cipher
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 5
      mosca_y: 5
      mosca_z: 5

  # ── Java ──────────────────────────────────────────────────────────────────────
  - id: java-weak-hash-md5
    patterns:
      - pattern: MessageDigest.getInstance("MD5")
    message: >
      Use of MD5 detected (MessageDigest). MD5 is cryptographically broken.
      Migrate to SHA-256 or SHA-3.
    languages: [java]
    severity: ERROR
    metadata:
      algorithm: MD5
      category: weak-hash
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 3
      mosca_y: 5
      mosca_z: 5

  - id: java-weak-hash-sha1
    pattern-either:
      - pattern: MessageDigest.getInstance("SHA-1")
      - pattern: MessageDigest.getInstance("SHA1")
    message: >
      Use of SHA-1 detected (MessageDigest). SHA-1 is susceptible to collision
      attacks. Migrate to SHA-256.
    languages: [java]
    severity: ERROR
    metadata:
      algorithm: SHA1
      category: weak-hash
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 1
      mosca_y: 1
      mosca_z: 10

  - id: java-insecure-des
    pattern-either:
      - pattern: Cipher.getInstance("DES")
      - pattern: Cipher.getInstance("DES/ECB/PKCS5Padding")
      - pattern: Cipher.getInstance("DES/ECB/NoPadding")
      - pattern: Cipher.getInstance("DES/CBC/PKCS5Padding")
      - pattern: Cipher.getInstance("DES/CFB/PKCS5Padding")
      - pattern: Cipher.getInstance("DES/OFB/PKCS5Padding")
      - pattern: KeyGenerator.getInstance("DES")
    message: >
      DES detected (JCE). DES uses a 56-bit key and has been broken since 1997.
      Use AES-GCM instead.
    languages: [java]
    severity: ERROR
    metadata:
      algorithm: DES
      category: broken-cipher
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 5
      mosca_y: 6
      mosca_z: 5

  - id: java-insecure-3des
    pattern-either:
      - pattern: Cipher.getInstance("DESede")
      - pattern: Cipher.getInstance("DESede/CBC/PKCS5Padding")
      - pattern: Cipher.getInstance("DESede/ECB/PKCS5Padding")
      - pattern: KeyGenerator.getInstance("DESede")
    message: >
      3DES detected (JCE). 3DES is slow and vulnerable to Sweet32. Use AES-GCM.
    languages: [java]
    severity: WARNING
    metadata:
      algorithm: 3DES
      category: weak-cipher
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 3
      mosca_y: 3
      mosca_z: 10

  - id: java-insecure-rc4
    pattern-either:
      - pattern: Cipher.getInstance("RC4")
      - pattern: Cipher.getInstance("ARC4")
      - pattern: Cipher.getInstance("RC4/None/NoPadding")
      - pattern: KeyGenerator.getInstance("RC4")
      - pattern: KeyGenerator.getInstance("ARC4")
    message: >
      RC4 detected (JCE). RC4 is a broken stream cipher. Use AES-GCM.
    languages: [java]
    severity: ERROR
    metadata:
      algorithm: RC4
      category: broken-cipher
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 2
      mosca_y: 2
      mosca_z: 10

  - id: java-insecure-blowfish
    pattern-either:
      - pattern: Cipher.getInstance("Blowfish")
      - pattern: Cipher.getInstance("Blowfish/CBC/PKCS5Padding")
      - pattern: Cipher.getInstance("Blowfish/ECB/PKCS5Padding")
      - pattern: KeyGenerator.getInstance("Blowfish")
    message: >
      Blowfish detected (JCE). Blowfish has a 64-bit block size and is
      vulnerable to birthday attacks. Use AES-GCM.
    languages: [java]
    severity: WARNING
    metadata:
      algorithm: BLOWFISH
      category: weak-cipher
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 2
      mosca_y: 2
      mosca_z: 10

  - id: java-ecb-mode
    pattern-either:
      - pattern: Cipher.getInstance("AES/ECB/PKCS5Padding")
      - pattern: Cipher.getInstance("AES/ECB/NoPadding")
      - pattern: Cipher.getInstance("DES/ECB/PKCS5Padding")
    message: >
      ECB mode detected (JCE). Identical plaintext blocks produce identical
      ciphertext, leaking data patterns. Use AES-GCM/CTR with an IV.
    languages: [java]
    severity: ERROR
    metadata:
      algorithm: AES-ECB
      category: broken-cipher
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 5
      mosca_y: 3
      mosca_z: 5

  - id: java-quantum-vulnerable-rsa
