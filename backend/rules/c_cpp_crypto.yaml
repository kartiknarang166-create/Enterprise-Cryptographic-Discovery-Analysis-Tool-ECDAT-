rules:
  # ── C/C++: MD5_Init (OpenSSL) ────────────────────────────────────────────────
  - id: c-weak-hash-md5
    patterns:
      - pattern: MD5_Init(...)
    message: >
      MD5_Init detected (OpenSSL). MD5 is cryptographically broken and
      susceptible to collision attacks. Migrate to SHA-256 or SHA-3.
    languages: [c, cpp]
    severity: ERROR
    metadata:
      algorithm: MD5
      category: weak-hash
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 3
      mosca_y: 5
      mosca_z: 5

  - id: c-weak-hash-md5-update
    patterns:
      - pattern: MD5_Update(...)
    message: >
      MD5_Update detected (OpenSSL). MD5 is cryptographically broken.
      Migrate to SHA-256 or SHA-3.
    languages: [c, cpp]
    severity: ERROR
    metadata:
      algorithm: MD5
      category: weak-hash
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 3
      mosca_y: 5
      mosca_z: 5

  # ── C/C++: SHA1 (OpenSSL) ─────────────────────────────────────────────────────
  - id: c-weak-hash-sha1
    patterns:
      - pattern: SHA1_Init(...)
    message: >
      SHA1_Init detected (OpenSSL). SHA-1 is cryptographically weak.
      Migrate to SHA-256 or SHA-3.
    languages: [c, cpp]
    severity: ERROR
    metadata:
      algorithm: SHA1
      category: weak-hash
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 1
      mosca_y: 1
      mosca_z: 10

  # ── C/C++: DES (OpenSSL) ──────────────────────────────────────────────────────
  - id: c-insecure-des
    patterns:
      - pattern: DES_set_key_unchecked(...)
    message: >
      DES_set_key_unchecked detected (OpenSSL). DES uses a 56-bit key and
      has been broken since 1997. Replace with AES-256-GCM.
    languages: [c, cpp]
    severity: ERROR
    metadata:
      algorithm: DES
      category: broken-cipher
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 5
      mosca_y: 6
      mosca_z: 5

  # ── C/C++: RC4 (OpenSSL) ─────────────────────────────────────────────────────
  - id: c-insecure-rc4
    patterns:
      - pattern: RC4(...)
    message: >
      RC4 stream cipher detected (OpenSSL). RC4 is cryptographically broken.
      Migrate to AES-256-GCM or ChaCha20-Poly1305.
    languages: [c, cpp]
    severity: ERROR
    metadata:
      algorithm: RC4
      category: broken-cipher
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 2
      mosca_y: 2
      mosca_z: 10

  # ── C/C++: RSA (OpenSSL - quantum vulnerable) ─────────────────────────────────
  - id: c-rsa-quantum-vulnerable
    patterns:
      - pattern: RSA_generate_key(...)
    message: >
      RSA_generate_key detected. RSA is quantum-vulnerable (Shor's algorithm).
      Migrate to ML-KEM (NIST FIPS 203).
    languages: [c, cpp]
    severity: WARNING
    metadata:
      algorithm: RSA
      category: quantum-vulnerable
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 15
      mosca_y: 5
      mosca_z: 7

  - id: c-rsa-generate-key-ex
    patterns:
      - pattern: RSA_generate_key_ex(...)
    message: >
      RSA_generate_key_ex detected. RSA is quantum-vulnerable (Shor's algorithm).
      Migrate to ML-KEM (NIST FIPS 203).
    languages: [c, cpp]
    severity: WARNING
    metadata:
      algorithm: RSA
      category: quantum-vulnerable
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 15
      mosca_y: 5
      mosca_z: 7

  # ── C/C++: ECDSA (OpenSSL - quantum vulnerable) ───────────────────────────────
  - id: c-ecdsa-quantum-vulnerable
    patterns:
      - pattern: ECDSA_sign(...)
    message: >
      ECDSA_sign detected. ECDSA is quantum-vulnerable (Shor's algorithm).
      Migrate to ML-DSA (NIST FIPS 204).
    languages: [c, cpp]
    severity: WARNING
    metadata:
      algorithm: ECDSA
      category: quantum-vulnerable
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 5
      mosca_y: 5
      mosca_z: 7

  # ── C/C++: EVP generic digest (OpenSSL) ───────────────────────────────────────
  - id: c-evp-md-ctx
    patterns:
      - pattern: EVP_MD_CTX_new(...)
    message: >
      EVP_MD_CTX_new detected. Ensure only approved hash functions (SHA-256, SHA-3)
      are used via EVP_DigestInit_ex. MD5 and SHA-1 are prohibited.
    languages: [c, cpp]
    severity: INFO
    metadata:
      algorithm: EVP-HASH
      category: generic-digest
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 5
      mosca_y: 3
      mosca_z: 10
