      category: quantum-vulnerable
      cwe: CWE-327
      owasp: A02:2021
      mosca_x: 15
      mosca_y: 5
      mosca_z: 7

  # ── JavaScript/TypeScript: SubtleCrypto ECDSA/ECDH (quantum-vulnerable) ───────
